name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref (branch or SHA) to run CI against (default: main)"
        required: false
        type: string
        default: main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ${{ matrix.os }} · Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is a real target, not an afterthought: git for Windows ships a
        # POSIX sh but not exec permissions, npm CLIs are .cmd shims that
        # execFile cannot spawn by bare name, and `taskkill /T` is the only way
        # to kill a process tree. src/platform/exec.ts covers those; this job is
        # what proves it.
        os: [ ubuntu-latest, windows-latest ]
        node-version: [ 20.x ]

    steps:
      - name: Configure git line endings
        # Git for Windows defaults core.autocrlf to true, which rewrites the
        # checkout to CRLF. oxfmt then sees every file as unformatted while the
        # identical tree passes on ubuntu. Must run before checkout, and is
        # scoped to the runner rather than the repo so no developer config is
        # touched.
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: |
          STORE_PATH="$(pnpm store path 2>/dev/null || echo "${HOME}/.pnpm-store")"
          echo "store-path=$STORE_PATH" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.store-path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install git-flow-next
        # git_flow and the flow_* worktree actions wrap this binary, so CI needs
        # it to prove those paths work — especially on Windows, where the binary
        # is a signed .exe that our PATH/PATHEXT resolver has to find.
        # Pinned, and checksum-verified against the release's checksums file.
        shell: bash
        env:
          GIT_FLOW_VERSION: v2.1.0
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Linux)   asset="git-flow-next-${GIT_FLOW_VERSION}-linux-amd64.tar.gz" ;;
            Windows) asset="git-flow-next-${GIT_FLOW_VERSION}-windows-amd64.zip" ;;
            *) echo "unsupported runner: ${{ runner.os }}"; exit 1 ;;
          esac
          base="https://github.com/gittower/git-flow-next/releases/download/${GIT_FLOW_VERSION}"
          curl -fsSL -o "$RUNNER_TEMP/$asset" "$base/$asset"
          curl -fsSL -o "$RUNNER_TEMP/checksums.txt" "$base/git-flow-next-${GIT_FLOW_VERSION}-checksums.txt"
          cd "$RUNNER_TEMP"
          grep " $asset\$" checksums.txt | sha256sum --check --strict -
          if [[ "$asset" == *.zip ]]; then
            unzip -q -o "$asset" -d flowbin
            install -m 0755 "$(find flowbin -type f -name 'git-flow*' | head -1)" "$RUNNER_TEMP/git-flow.exe"
          else
            # Extract to a subdirectory: $RUNNER_TEMP is the cwd, so extracting
            # in place would make the source and the destination the same file.
            mkdir -p flowbin && tar -xzf "$asset" -C flowbin
            install -m 0755 "$(find flowbin -type f -name 'git-flow*' | head -1)" "$RUNNER_TEMP/git-flow"
          fi
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          # $GITHUB_PATH applies to *later* steps, so prove the binary here.
          PATH="$RUNNER_TEMP:$PATH" git flow version

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint
        continue-on-error: true

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Verify build outputs
        shell: bash
        run: |
          test -f dist/index.js     || exit 1
          test -f dist/index.js.map || exit 1
          test -f dist/index.d.ts   || exit 1
          test -f dist/package.json || exit 1
          echo "✓ All build outputs verified"

      - name: Test
        run: pnpm test --coverage --reporter=default  --reporter=junit --outputFile=test-report.junit.xml

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage reports to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ runner.os }}
